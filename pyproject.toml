[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydra2app-xnat"
description = "An extension of the pydra2app to support making XNAT container service images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydra2app >= 0.23.3",
    "fileformats >=0.22.5",
    "fileformats-medimage >=0.15.5",
    "fileformats-medimage-extras >=0.15.5",
    "frametree >=0.17.4",
    "frametree-xnat >= 0.6.16",
    "xnat",
]
license = { file = "LICENSE" }
authors = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
maintainers = [{ name = "Thomas G. Close", email = "tom.g.close@gmail.com" }]
keywords = ["pydra2app"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["black", "codespell", "flake8", "flake8-pyproject", "pre-commit"]
doc = [
    "docutils >=0.10",
    "furo >=2022.2.14.1",
    "mock >=1.0",
    "numpydoc >=0.6.0",
    "packaging",
    "sphinx >=2.1.2",
    "sphinx-argparse >=0.2.0",
    "sphinx-click >=3.1",
]
test = [
    "frametree-bids >=0.5",
    "medimages4tests >=0.5",
    "pydra-compose-bidsapp >=0.3",
    "pytest >=8",
    "pytest-cov >=5",
    "xnat4tests >=0.4",
    "imageio >=2.25.0",
]

[project.urls]
documentation = "https://pydra2app.readthedocs.io"
repository = "https://github.com/ArcanaFramework/pydra2app-xnat.git"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "pydra2app/xnat/_version.py"

[tool.hatch.build]
packages = ["pydra2app"]
exclude = ["/tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py38"]
exclude = "_version.py"

[tool.isort]
profile = "black"
known_first_party = ["pydra2app"]
honor_noqa = true                 # so that '# noqa' imports are skipped, as Ruff skips them

# Kept in step with the isort config above so that both tools agree on how imports
# should be sorted, in particular on which packages are first-party
[tool.ruff.lint.isort]
known-first-party = ["pydra2app"]
# xnatpy's 'xnat' package is otherwise taken to be first-party, as it shares its name
# with the 'pydra2app/xnat' sub-package
known-third-party = ["xnat"]

[tool.codespell]
ignore-words = ".codespell-ignorewords"

[tool.flake8]
doctests = true
per-file-ignores = ["__init__.py:F401"]
max-line-length = 88
select = "C,E,F,W,B,B950"
extend-ignore = ['E203', 'E501', 'E129', 'W503']


[tool.mypy]
ignore_missing_imports = true
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = ["tests", "scripts", "docs", "build", "dist"]
